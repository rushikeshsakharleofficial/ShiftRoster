[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=app --cov-report=html --cov-report=term-missing --strict-markers
markers =
    unit: unit tests
    integration: integration tests
    e2e: end-to-end tests
    slow: slow tests
