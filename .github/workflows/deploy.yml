name: CI/CD — Review & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  review:
    name: Code Review
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Backend checks ──
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt flake8 bandit pip-audit

      - name: Lint — fatal errors only (syntax, undefined names)
        run: |
          cd backend
          flake8 . --count --select=E9,F63,F7 --extend-ignore=F821 --show-source --statistics

      - name: Security scan — code (bandit)
        run: bandit -r backend/ -ll --exclude backend/tests -q

      - name: Security scan — Python deps (pip-audit)
        run: |
          # CVE-2025-54121 + CVE-2025-62727: starlette DoS vulns fixed in 0.47/0.49
          # Cannot upgrade: fastapi 0.115.x caps starlette at <0.47. Tracked for future fastapi upgrade.
          pip-audit -r backend/requirements.txt --desc \
            --ignore-vuln CVE-2025-54121 \
            --ignore-vuln CVE-2025-62727

      # ── Frontend checks ──
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Security scan — Node deps (npm audit)
        run: cd frontend && npm audit --audit-level=high

      - name: Frontend build check
        run: cd frontend && npm run build
        env:
          CI: false   # treat warnings as non-fatal

  version-bump:
    name: Bump Version
    needs: review
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bump patch version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd frontend
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          cd ..
          git add frontend/package.json frontend/package-lock.json
          git commit -m "chore: bump version to v${NEW_VERSION} [skip ci]"
          git push origin master

  deploy:
    name: Deploy to Production
    needs: version-bump
    runs-on: ubuntu-latest

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            set -e
            echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S bash -c '
              cd /projects/ShiftRoster
              git pull origin master
              docker compose up -d --build --no-deps backend frontend
              docker compose ps
            '
            echo "Deploy complete"
