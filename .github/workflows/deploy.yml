name: CI/CD — Review & Deploy

on:
  push:
    branches: [master]

jobs:
  review:
    name: Code Review
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Backend checks ──
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint — fatal errors only (syntax, undefined names)
        run: |
          cd backend
          pip install flake8
          flake8 . --count --select=E9,F63,F7 --extend-ignore=F821 --show-source --statistics

      - name: Security scan — code (bandit)
        run: |
          pip install bandit
          bandit -r backend/ -ll --exclude backend/tests -q

      - name: Security scan — Python deps (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --desc

      # ── Frontend checks ──
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Security scan — Node deps (npm audit)
        run: cd frontend && npm audit --audit-level=high

      - name: Frontend build check
        run: cd frontend && npm run build
        env:
          CI: false   # treat warnings as non-fatal

  deploy:
    name: Deploy to Production
    needs: review
    # Runs ON the server — no inbound SSH needed, outbound-only to GitHub
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /projects/ShiftRoster
          git pull origin master

      - name: Rebuild changed containers
        run: |
          cd /projects/ShiftRoster
          docker compose up -d --build --no-deps backend frontend

      - name: Verify healthy
        run: |
          cd /projects/ShiftRoster
          docker compose ps
          echo "Deploy complete"
