services:
  # MongoDB
  mongo:
    image: mongo:7
    container_name: shiftroster-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shiftroster-backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: shiftroster
      JWT_SECRET: ${JWT_SECRET:-shiftroster-dev-secret-change-in-production}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Frontend (React + Nginx static server — internal only)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${PROTOCOL:-http}://${DOMAIN:-localhost}
    container_name: shiftroster-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  # Nginx Reverse Proxy — SSL termination, public entrypoint
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: shiftroster-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      PROTOCOL: ${PROTOCOL:-http}
      BACKEND_URL: http://backend:8000
      FRONTEND_URL: http://frontend:80
      SSL_CERT: /etc/nginx/ssl/cert.pem
      SSL_KEY: /etc/nginx/ssl/key.pem
    volumes:
      # Mount SSL certs from host (place cert.pem + key.pem in ./ssl/)
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend

volumes:
  mongo_data:
    driver: local
  backend_uploads:
    driver: local
