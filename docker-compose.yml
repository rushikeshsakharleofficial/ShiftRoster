services:
  # MongoDB — NOT exposed to host; internal network only; auth enforced
  mongo:
    image: mongo:7
    container_name: shiftroster-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-shiftroster}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_USER:-shiftroster}", "-p", "${MONGO_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shiftroster-backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://${MONGO_USER:-shiftroster}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      DB_NAME: shiftroster
      JWT_SECRET: ${JWT_SECRET}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      MSG_ENCRYPT_KEY: ${MSG_ENCRYPT_KEY}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Frontend (React + Nginx static server — internal only)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shiftroster-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  # Nginx Reverse Proxy — SSL termination, public entrypoint
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: shiftroster-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      PROTOCOL: ${PROTOCOL:-http}
      BACKEND_URL: http://backend:8000
      FRONTEND_URL: http://frontend:80
      SSL_CERT: /etc/nginx/ssl/cert.pem
      SSL_KEY: /etc/nginx/ssl/key.pem
    volumes:
      # Mount SSL certs from host (place cert.pem + key.pem in ./ssl/)
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend

  # GitHub Actions self-hosted runner — auto-registers on first start
  # Needs GITHUB_PAT (repo scope) in .env — never expires, no manual token refresh
  github-runner:
    image: myoung34/github-runner:latest
    container_name: shiftroster-runner
    restart: unless-stopped
    environment:
      ACCESS_TOKEN: ${GITHUB_PAT}
      REPO_URL: https://github.com/rushikeshsakharleofficial/ShiftRoster
      RUNNER_NAME: shiftroster-server
      RUNNER_WORKDIR: /tmp/runner/work
      RUNNER_SCOPE: repo
      LABELS: self-hosted
      EPHEMERAL: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /projects/ShiftRoster:/projects/ShiftRoster
      - runner_work:/tmp/runner

volumes:
  mongo_data:
    driver: local
  backend_uploads:
    driver: local
  runner_work:
    driver: local
